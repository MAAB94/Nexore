    <script>
      (function () {
        function isBrowserExtensionError(source, stack, message) {
          var extPattern = /^(chrome|moz|safari)-extension:\/\//i;
          if (source && extPattern.test(source)) return true;
          if (stack && /(chrome|moz|safari)-extension:\/\//i.test(stack)) return true;
          if (message && /Failed to connect to MetaMask/i.test(message) && (!stack || /inpage\.js|extension/i.test(stack))) {
            return true;
          }
          return false;
        }
        window.addEventListener(
          'error',
          function (event) {
            var stack = event.error && event.error.stack ? String(event.error.stack) : '';
            var msg = event.message ? String(event.message) : '';
            if (isBrowserExtensionError(event.filename, stack, msg)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event.reason;
            var stack = reason && reason.stack ? String(reason.stack) : '';
            var msg = reason && reason.message ? String(reason.message) : String(reason || '');
            if (isBrowserExtensionError('', stack, msg)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
